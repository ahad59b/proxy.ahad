<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071719">
<title>AHAD VAI PROXY</title>

<style>
:root {
  color-scheme: dark;
  --bg: #071719;
  --panel: #102629;
  --teal: #35e0c0;
  --muted: #a4bfbd;
  --line: #244447;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: grid;
  place-items: center;
  background: radial-gradient(
    ellipse at top,
    #123638 0%,
    #071719 65%
  );
  font: 16px/1.5 system-ui, sans-serif;
  color: #effffb;
}

main {
  width: min(100%, 520px);
}

.brand {
  text-align: center;
  color: var(--teal);
  font-size: clamp(1.7rem, 6vw, 2.3rem);
  font-weight: 900;
  letter-spacing: .06em;
  margin: 0 0 5px;
}

.sub {
  text-align: center;
  color: var(--muted);
  margin: 0 0 25px;
}

.card {
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(160deg, #102a2c, #0b1d1f);
  box-shadow: 0 20px 65px #0006;
}

.icon {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: #123f36;
  border: 1px solid #267567;
  font-size: 36px;
}

h2 {
  text-align: center;
  margin: 0 0 8px;
}

.description {
  text-align: center;
  color: var(--muted);
  margin: 0 0 25px;
}

.info {
  padding: 17px;
  margin: 20px 0;
  border: 1px solid var(--line);
  background: #091a1c;
  border-radius: 14px;
  text-align: center;
}

.info strong {
  color: var(--teal);
  display: block;
  margin-bottom: 5px;
  font-size: 1.1rem;
}

.info span {
  color: var(--muted);
  font-size: .92rem;
}

button {
  width: 100%;
  min-height: 50px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.primary {
  background: var(--teal);
  color: #06201e;
}

.primary:active {
  transform: scale(.98);
}

.msg {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: #183537;
  color: #e6fffa;
  text-align: center;
  overflow-wrap: anywhere;
}

.msg a {
  color: var(--teal);
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #73918f;
  font-size: .8rem;
  margin-top: 20px;
}

@media (max-width: 400px) {
  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>
<main>

  <h1 class="brand">AHAD VAI PROXY</h1>
  <p class="sub">Your Proxy Dashboard</p>

  <section class="card">

    <div class="icon">⚡</div>

    <h2>Welcome Back!</h2>

    <p class="description">
      Welcome to AHAD VAI PROXY.
      Connect your configuration using HAPP.
    </p>

    <div class="info">
      <strong>AHAD VAI PROXY</strong>
      <span>Proxy Configuration</span>
    </div>

    <button
      class="primary"
      id="happBtn"
      type="button">
      ADD TO HAPP
    </button>

    <div
      id="happMsg"
      class="msg"
      hidden
      role="status"
      aria-live="polite">
    </div>

  </section>

  <footer>
    AHAD VAI PROXY · Proxy Dashboard
  </footer>

</main>

<script>
"use strict";

const configUrl = "https://gtoools.site/FB/config.json";

const happUrl =
  "happ://add/" +
  configUrl +
  "#AHAD%20VAI%20PROXY";

const button = document.getElementById("happBtn");
const message = document.getElementById("happMsg");

button.addEventListener("click", function () {
  message.hidden = false;
  message.textContent =
    "Opening HAPP... Please wait.";

  window.location.href = happUrl;

  setTimeout(function () {
    message.replaceChildren(
      document.createTextNode(
        "If HAPP did not open, install or update HAPP, " +
        "then open this configuration URL manually: "
      ),
      document.createElement("br"),
      document.createElement("a")
    );

    const link = message.querySelector("a");
    link.href = configUrl;
    link.textContent = configUrl;
  }, 1800);
});
</script>

</body>
  </html>
